<body>
<canvas id="c"></canvas>
<script>
'use strict';
// =====================================================================
//  SKYBREAKER  —  dynamic aerial combat (single file, canvas 2D)
// =====================================================================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const FONT = "Orbitron, 'Black Han Sans', 'Malgun Gothic', sans-serif";
const KFONT = "'Black Han Sans', 'Malgun Gothic', sans-serif";
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
};
const angLerp = (a, b, t) => { const d = ((b - a + Math.PI * 3) % TAU) - Math.PI; return a + d * t; };
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

let vign, redVign;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  vign = makeVignette('0,0,0', 0.55);
  redVign = makeVignette('255,0,30', 0.75);
}
function makeVignette(col, a) {
  const c = document.createElement('canvas'); c.width = Math.max(1, W); c.height = Math.max(1, H);
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  gr.addColorStop(0, `rgba(${col},0)`); gr.addColorStop(1, `rgba(${col},${a})`);
  g.fillStyle = gr; g.fillRect(0, 0, W, H); return c;
}
addEventListener('resize', resize); resize();
try { document.fonts.load('900 20px Orbitron'); document.fonts.load('20px "Black Han Sans"', '가'); } catch (e) {}

// ============================ AUDIO ==================================
let AC = null, master = null, noiseBuf = null, hum = null;
function initAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.32; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function tone(type, f0, f1, dur, vol, delay = 0) {
  if (!AC) return; const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, f0, f1, delay = 0, q = 1) {
  if (!AC) return; const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.03);
}
const thr = {};
function throttle(k, ms) { const n = performance.now(); if (thr[k] && n - thr[k] < ms) return false; thr[k] = n; return true; }
const SFX = {
  shoot() { if (throttle('s', 75)) tone('square', 900, 260, 0.05, 0.035); },
  hit() { if (throttle('h', 60)) tone('square', 320, 140, 0.04, 0.04); },
  boom() { if (throttle('b', 45)) { noise(0.5, 0.45, 2200, 60); tone('sine', 130, 30, 0.35, 0.35); } },
  bigboom() { noise(1.8, 0.8, 3500, 30); tone('sine', 90, 18, 1.4, 0.6); tone('sawtooth', 60, 20, 1, 0.2); },
  power() { [0, 4, 7, 12, 16].forEach((s, i) => tone('triangle', 520 * Math.pow(2, s / 12), 520 * Math.pow(2, s / 12), 0.12, 0.13, i * 0.05)); },
  bomb() { noise(1.4, 0.7, 6000, 40); tone('sawtooth', 500, 30, 1.1, 0.25); tone('sine', 70, 20, 1.2, 0.5); },
  hurt() { tone('sawtooth', 420, 50, 0.4, 0.3); noise(0.35, 0.35, 3000, 200); },
  dash() { if (throttle('d', 60)) noise(0.3, 0.22, 600, 5000, 0, 3); },
  warn() { for (let i = 0; i < 3; i++) { tone('sawtooth', 440, 880, 0.4, 0.13, i * 0.8); tone('sawtooth', 880, 440, 0.4, 0.13, i * 0.8 + 0.4); } },
  missile() { if (throttle('m', 120)) noise(0.25, 0.08, 1800, 300); },
  graze() { if (throttle('g', 50)) tone('sine', 1900, 2600, 0.04, 0.03); },
  charge() { tone('sine', 180, 1400, 1.1, 0.1); },
  zap() { if (throttle('z', 100)) { noise(0.6, 0.35, 5000, 300, 0, 2); tone('sawtooth', 120, 60, 0.6, 0.15); } },
  fan() { if (throttle('f', 120)) tone('triangle', 300, 120, 0.12, 0.06); },
  ui() { tone('triangle', 660, 990, 0.08, 0.1); },
};
function setHum(on) {
  if (!AC) return;
  try {
    if (!hum) {
      const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = 110; o2.type = 'square'; o2.frequency.value = 222;
      f.type = 'lowpass'; f.frequency.value = 1100; g.gain.value = 0;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(master); o.start(); o2.start(); hum = g;
    }
    hum.gain.setTargetAtTime(on ? 0.05 : 0, AC.currentTime, 0.04);
  } catch (e) {}
}

// ============================ GLOW SPRITES ===========================
const COL = { fire: [255, 130, 30], hot: [255, 235, 180], blue: [70, 160, 255], cyan: [0, 235, 255], green: [90, 255, 140], pink: [255, 60, 170], red: [255, 40, 50], yellow: [255, 225, 70], purple: [175, 90, 255], white: [255, 255, 255], orange: [255, 160, 40] };
const glowCache = {};
function glowSpr(n) {
  let c = glowCache[n]; if (c) return c;
  const [r, g, b] = COL[n]; c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); const gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.15, `rgba(${r},${g},${b},1)`);
  gr.addColorStop(0.42, `rgba(${r},${g},${b},0.33)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128); return glowCache[n] = c;
}
function glow(x, y, r, n, a = 1) { if (a <= 0 || r <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glowSpr(n), x - r, y - r, r * 2, r * 2); }
function glowE(x, y, rx, ry, n, a = 1) { if (a <= 0) return; ctx.globalAlpha = Math.min(1, a); ctx.drawImage(glowSpr(n), x - rx, y - ry, rx * 2, ry * 2); }

// ============================ STAGES / BACKGROUND ====================
const STAGES = [
  { name: 'DAWN STRIKE', kr: '새벽의 기습', top: [38, 28, 88], mid: [226, 108, 122], bot: [255, 192, 128], sun: [255, 205, 150], cloud: [255, 205, 196], stars: 0.35, acc: '#ff4d6d', accG: 'pink' },
  { name: 'BLUE HORIZON', kr: '푸른 지평선', top: [18, 72, 170], mid: [70, 150, 230], bot: [175, 222, 255], sun: [255, 255, 230], cloud: [255, 255, 255], stars: 0, acc: '#3df2ff', accG: 'cyan' },
  { name: 'CRIMSON SUNSET', kr: '진홍의 석양', top: [48, 18, 78], mid: [196, 58, 88], bot: [255, 140, 62], sun: [255, 130, 70], cloud: [255, 160, 150], stars: 0.2, acc: '#ffb03b', accG: 'orange' },
  { name: 'MIDNIGHT RAID', kr: '한밤의 습격', top: [4, 7, 22], mid: [14, 24, 58], bot: [38, 50, 102], sun: [200, 220, 255], cloud: [80, 92, 140], stars: 1, acc: '#9d6bff', accG: 'purple' },
  { name: 'EDGE OF SPACE', kr: '성층권의 끝', top: [0, 0, 6], mid: [10, 10, 40], bot: [62, 40, 122], sun: [190, 150, 255], cloud: [110, 92, 190], stars: 1, acc: '#4dff9d', accG: 'green' },
];
const mixPal = (a, b, t) => { const m = (x, y) => x.map((v, i) => Math.round(lerp(v, y[i], t))); return { top: m(a.top, b.top), mid: m(a.mid, b.mid), bot: m(a.bot, b.bot), sun: m(a.sun, b.sun), cloud: m(a.cloud, b.cloud), stars: lerp(a.stars, b.stars, t) }; };
let pal = mixPal(STAGES[0], STAGES[0], 0), palFrom = pal, palTo = STAGES[0], palT = 1, cloudsRegen = true;
function setStagePal(i) { palFrom = pal; palTo = STAGES[i % STAGES.length]; palT = 0; cloudsRegen = false; }

let cloudSprites = [];
function makeClouds(col) {
  cloudSprites = []; const cs = col.join(',');
  for (let k = 0; k < 5; k++) {
    const c = document.createElement('canvas'); c.width = 320; c.height = 180; const g = c.getContext('2d');
    for (let i = 0; i < 18; i++) {
      const x = rand(80, 240), r = rand(28, 58), y = rand(80, 120) - (Math.abs(x - 160) < 60 ? rand(0, 26) : 0);
      const gr = g.createRadialGradient(x, y - r * 0.35, 0, x, y, r);
      gr.addColorStop(0, `rgba(${cs},0.95)`); gr.addColorStop(0.6, `rgba(${cs},0.45)`); gr.addColorStop(1, `rgba(${cs},0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
    }
    cloudSprites.push(c);
  }
}
makeClouds(STAGES[0].cloud);

const world = { scroll: 190, mul: 1 };
let clouds = [], stars = [], lines = [];
function initBG() {
  clouds = [];
  const add = (layer) => clouds.push({ x: rand(-150, W), y: rand(-200, H + 100), layer, s: layer === 0 ? rand(0.4, 0.7) : layer === 1 ? rand(0.9, 1.5) : rand(2.2, 3.2), spr: Math.random() * 5 | 0, a: layer === 0 ? 0.55 : layer === 1 ? 0.8 : 0.32 });
  for (let i = 0; i < 9; i++) add(0); for (let i = 0; i < 5; i++) add(1); for (let i = 0; i < 2; i++) add(2);
  stars = []; for (let i = 0; i < 150; i++) stars.push({ x: rand(0, W), y: rand(0, H), z: rand(0.6, 2.2), a: rand(0.3, 1), p: rand(0, TAU) });
  lines = []; for (let i = 0; i < 45; i++) lines.push({ x: rand(0, W), y: rand(0, H), l: rand(40, 160), s: rand(900, 1800) });
}
initBG();
addEventListener('resize', initBG);

function updBG(dt) {
  const sp = world.scroll * world.mul;
  const ls = [0.25, 0.6, 2.1];
  for (const c of clouds) {
    c.y += sp * ls[c.layer] * dt;
    if (c.y - 100 * c.s > H) { c.y = -100 * c.s - rand(0, 300); c.x = rand(-160 * c.s, W); c.spr = Math.random() * 5 | 0; }
  }
  for (const s of stars) { s.y += sp * 0.04 * dt; if (s.y > H) { s.y = 0; s.x = rand(0, W); } }
  for (const l of lines) { l.y += l.s * (0.4 + world.mul * 0.6) * dt; if (l.y - l.l > H) { l.y = -rand(0, 300); l.x = rand(0, W); } }
}
let gtime = 0;
function drawBG() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(pal.top)); g.addColorStop(0.55, rgb(pal.mid)); g.addColorStop(1, rgb(pal.bot));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (pal.stars > 0.01) {
    ctx.fillStyle = '#fff';
    for (const s of stars) { ctx.globalAlpha = pal.stars * s.a * (0.55 + 0.45 * Math.sin(gtime * 3 + s.p)) * (1 - s.y / H * 0.6); ctx.fillRect(s.x, s.y, s.z, s.z); }
    ctx.globalAlpha = 1;
  }
  // sun + lens flare (moves with the player for parallax)
  const px = player ? player.x : W / 2;
  const sx = W * 0.8 - (px - W / 2) * 0.05, sy = H * 0.17;
  ctx.globalCompositeOperation = 'lighter';
  const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 300);
  sg.addColorStop(0, rgb(pal.sun, 0.95)); sg.addColorStop(0.07, rgb(pal.sun, 0.7)); sg.addColorStop(0.25, rgb(pal.sun, 0.18)); sg.addColorStop(1, rgb(pal.sun, 0));
  ctx.fillStyle = sg; ctx.fillRect(sx - 300, sy - 300, 600, 600);
  const cx = W / 2 + (px - W / 2) * 0.4, cy = H * 0.6;
  [[0.35, 24, 0.10, 'cyan'], [0.6, 12, 0.14, 'orange'], [0.85, 46, 0.06, 'purple'], [1.25, 30, 0.08, 'cyan'], [1.5, 8, 0.2, 'white']].forEach(([t, r, a, c]) => glow(lerp(sx, cx, t), lerp(sy, cy, t), r, c, a));
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function drawClouds(layer) {
  for (const c of clouds) {
    if (c.layer !== layer) continue;
    ctx.globalAlpha = c.a;
    ctx.drawImage(cloudSprites[c.spr], c.x, c.y - 90 * c.s, 320 * c.s, 180 * c.s);
  }
  ctx.globalAlpha = 1;
}
function drawSpeedLines() {
  const a = 0.05 + (world.mul - 1) * 0.12;
  if (a <= 0.01) return;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.globalAlpha = Math.min(0.55, a);
  ctx.beginPath();
  for (const l of lines) { ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y - l.l * world.mul); }
  ctx.stroke(); ctx.globalAlpha = 1;
}

// ============================ STATE ==================================
let state = 'title', paused = false;
let G = null, player = null;
let bullets = [], ebullets = [], enemies = [], parts = [], pickups = [], texts = [], ghosts = [], hazards = [], banners = [];
const fx = { shake: 0, flash: 0, flashCol: '255,255,255', dmg: 0, punch: 0, boost: 0 };
let timeScale = 1, slowT = 0, hitstop = 0, titleT = 0;
let hiScore = 0; try { hiScore = +localStorage.getItem('skybreaker_hi') || 0; } catch (e) {}
let isTouch = false;
const STAGE_LEN = 45;

function slowmo(s, d) { timeScale = Math.min(timeScale, s); slowT = Math.max(slowT, d); }
function flash(a, col = '255,255,255') { fx.flash = Math.max(fx.flash, a); fx.flashCol = col; }

// ============================ PARTICLES ==============================
function P(o) { if (parts.length < 2600) parts.push(o); }
function spark(x, y, a, sp, c = '#ffd27a', life = 0.4, w = 2) { P({ k: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life, max: life, c, w, drag: 3 }); }
function ring(x, y, r0, r1, life, c, w) { P({ k: 'ring', x, y, vx: 0, vy: 0, r0, r1, life, max: life, c, w }); }
function explode(x, y, s = 1, tint = 'fire') {
  const n = Math.round(10 + 12 * s);
  P({ k: 'glow', x, y, vx: 0, vy: 0, r: 46 * s, grow: 140 * s, life: 0.18, max: 0.18, c: 'hot', a: 1 });
  ring(x, y, 6 * s, 75 * s, 0.45, '#ffdca8', 5 * s);
  if (s >= 2) ring(x, y, 10 * s, 140 * s, 0.7, '#ffffff', 3 * s);
  for (let i = 0; i < n; i++) { const a = rand(0, TAU), sp = rand(160, 560) * Math.sqrt(s); spark(x, y, a, sp, i % 3 ? '#ffd27a' : '#ffffff', rand(0.25, 0.6), rand(1.5, 3)); }
  for (let i = 0; i < n * 0.7; i++) { const a = rand(0, TAU), sp = rand(20, 170) * s, l = rand(0.35, 0.8); P({ k: 'glow', x: x + rand(-8, 8) * s, y: y + rand(-8, 8) * s, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(10, 24) * s, grow: 22 * s, life: l, max: l, c: Math.random() < 0.3 ? 'hot' : tint, a: 0.9, drag: 3 }); }
  for (let i = 0; i < n * 0.5; i++) { const a = rand(0, TAU), sp = rand(10, 90) * s, l = rand(0.8, 1.8); P({ k: 'smoke', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(8, 18) * s, grow: 26 * s, life: l, max: l, c: '#3a3442', a: 0.42, drag: 2, fall: world.scroll * 0.6 }); }
  for (let i = 0; i < Math.min(12, n * 0.3); i++) { const a = rand(0, TAU), sp = rand(120, 380) * Math.sqrt(s), l = rand(0.6, 1.3); P({ k: 'deb', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rand(2, 5) * Math.sqrt(s), rot: rand(0, TAU), vr: rand(-14, 14), life: l, max: l, drag: 1.5, fall: 140 }); }
  fx.shake = Math.max(fx.shake, 4 * s + 2);
  if (s >= 2) fx.punch = Math.max(fx.punch, 0.018 * s);
  if (s >= 3) SFX.bigboom(); else SFX.boom();
}
function updParts(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0) { parts[i] = parts[parts.length - 1]; parts.pop(); continue; }
    if (p.drag) { const d = Math.exp(-p.drag * dt); p.vx *= d; p.vy *= d; }
    p.x += p.vx * dt; p.y += (p.vy + (p.fall || 0)) * dt;
    if (p.grow) p.r += p.grow * dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.k === 'deb' && Math.random() < 0.35) P({ k: 'smoke', x: p.x, y: p.y, vx: 0, vy: 0, r: p.r * 1.4, grow: 14, life: 0.5, max: 0.5, c: '#2c2833', a: 0.35, fall: world.scroll * 0.5 });
  }
}
function drawParts() {
  for (const p of parts) {
    const f = p.life / p.max;
    if (p.k === 'smoke') { ctx.globalAlpha = f * p.a; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
    else if (p.k === 'deb') { ctx.globalAlpha = 1; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = '#1d1a22'; ctx.fillRect(-p.r, -p.r * 0.6, p.r * 2, p.r * 1.2); ctx.restore(); }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const f = p.life / p.max;
    if (p.k === 'glow') glow(p.x, p.y, p.r, p.c, f * (p.a || 1));
    else if (p.k === 'spark') { ctx.globalAlpha = f; ctx.strokeStyle = p.c; ctx.lineWidth = p.w; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke(); }
    else if (p.k === 'ring') { ctx.globalAlpha = f; ctx.strokeStyle = p.c; ctx.lineWidth = Math.max(0.5, p.w * f); ctx.beginPath(); ctx.arc(p.x, p.y, lerp(p.r0, p.r1, ease.outCubic(1 - f)), 0, TAU); ctx.stroke(); }
    else if (p.k === 'deb') glow(p.x, p.y, 7, 'fire', f * 0.7);
  }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
function addText(x, y, s, c = '#fff', size = 16, dur = 0.9) { texts.push({ x, y, s, c, size, dur, t: 0 }); }

// ============================ SHAPES =================================
function mirrorPath(c, pts) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  for (let i = pts.length - 2; i >= 1; i--) c.lineTo(-pts[i][0], pts[i][1]);
  c.closePath();
}
const EPTS = {
  player: [[0, -32], [3, -24], [5.5, -8], [30, 10], [30, 15], [6, 13], [5, 19], [14, 27], [14, 30], [3, 28], [0, 28]],
  fighter: [[0, -24], [4, -12], [6, -2], [22, -12], [24, -8], [8, 10], [5, 14], [11, 22], [4, 20], [0, 20]],
  kamikaze: [[0, -24], [5, -4], [17, 14], [6, 10], [0, 17]],

function drawTitleWorld() {

  const jx = W / 2 + Math.sin(titleT * 0.9) * W * 0.22, jy = H * 0.72 + Math.sin(titleT * 1.8) * 34, bank = Math.cos(titleT * 0.9) * 0.9;
  const roll = (titleT % 6) > 5.4 ? ((titleT % 6) - 5.4) / 0.6 * TAU : 0;

}
function drawTitleUI() {
  const T = titleT, title = 'SKYBREAKER', fs = Math.min(104, W / 7.2), cy = H * 0.3;
  ctx.save(); ctx.font = `900 ${fs}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';

// ============================ RENDER =================================
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBG();

  const sh = fx.shake, ox = (Math.random() * 2 - 1) * sh, oy = (Math.random() * 2 - 1) * sh;
  const z = 1 + fx.punch, rot = -(player && state !== 'title' ? player.bank : 0) * 0.014 + (Math.random() * 2 - 1) * sh * 0.0012;

// ============================ LOOP ===================================
let last = performance.now();
function frame(now) {
  const rdt = Math.min(0.033, (now - last) / 1000); last = now;
  if (slowT > 0) { slowT -= rdt; } else timeScale = lerp(timeScale, 1, 1 - Math.exp(-rdt * 5));
  let dt = rdt * timeScale;
  if (hitstop > 0) { hitstop -= rdt; dt = 0; }
  if (paused) dt = 0;
  try { update(dt, rdt); render(); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
